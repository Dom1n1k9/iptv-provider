worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # No mime.types include needed - we inline the types we serve.
    access_log /dev/stdout;

    server {
        listen 80;
        server_name _;

        # HLS output for clients
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
        }

        # Simple debug landing page
        location / {
            return 200 "nginx-rtmp (iptv) alive\n";
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Ingest endpoint for your encoder
        application live {
            live on;
            record off;

            # Direct remux (passthrough stream) to HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 30s;
        }
    }
}
