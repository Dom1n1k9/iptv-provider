worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Enable hardware-accelerated H.264/H.265 decode where possible
    # (RPi 5 uses its VideoCore VII / V4L2 M2M codec, set this accordingly)
    # v4l2_codec on;

    server {
        listen 80;
        server_name _;

        # HLS output for clients
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp/hls;
            add_header Cache-Control no-cache;
        }

        # Simple status page (good for debugging on RPi)
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /www/static;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Ingest endpoint for your encoder
        application live {
            live on;
            record off;

            # Direct remux (passthrough stream) to HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 30s;
        }
    }
}
