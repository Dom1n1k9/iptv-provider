# Your channel lineup.
# The API turns this file into the M3U playlist served at /playlist.m3u

channels:
  - id: "main-live"
    name: "Main Live"
    logo: "/logo/main.png"
    # Replace <pi-ip> with your Pi's LAN IP (clients reach it from outside Docker)
    url: "http://<pi-ip>:8080/hls/main-live.m3u8"
    group: "Live"

  - id: "sports-1"
    name: "Sports 1"
    logo: "/logo/sports.png"
    url: "http://<pi-ip>:8080/hls/sports.m3u8"
    group: "Sports"
