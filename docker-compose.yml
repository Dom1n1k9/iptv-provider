version: "3.9"

services:
  # Live TV / RTMP ingest -> HLS (arm64-capable for RPi 5)
  iptv:
    image: tiangolo/nginx-rtmp:latest
    container_name: iptv
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (bind to LAN only: 192.168.1.10:1935:1935)
      - "8080:80"     # HTTP / HLS (LAN only)
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=Europe/Paris

  # EPG (Electronic Program Guide) server -> XMLTV served as /guide.xml on :3000
  # See https://github.com/iptv-org/epg (Docker section) for env vars.
  epg:
    image: ghcr.io/iptv-org/epg:master
    container_name: epg
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"   # localhost only; Caddy/API proxy to it
    volumes:
      - ./config/epg/channels.xml:/epg/public/channels.xml:ro
    environment:
      - TZ=Europe/Paris
      - RUN_AT_STARTUP=true      # grab guide on container start
      - CRON_SCHEDULE=0 0 * * *  # refresh daily

  # API - generates M3U + XMLTV and serves playlist to clients (TS)
  api:
    build: ./api
    container_name: iptv-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # localhost only; Caddy proxies
    volumes:
      - ./config/channels:/app/config/channels:ro
    environment:
      - TZ=Europe/Paris
      - PLAYLIST_USER=${PLAYLIST_USER:-admin}
      - PLAYLIST_PASS=${PLAYLIST_PASS:-changeme}
      # Public base URL baked into the generated playlist.
      # LAN-only: http://<pi-ip>:8080    |  With Caddy/TLS: https://iptv.example.com
      - STREAM_BASE_URL=${STREAM_BASE_URL:-http://<pi-ip>:8080}
      - EPG_UPSTREAM=http://epg:3000   # iptv-org/epg server serves /guide.xml
    depends_on:
      - epg

  # Reverse proxy / TLS front-end (recommended)
  proxy:
    image: caddy:2-alpine
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - iptv

  # Uptime Kuma - monitoring/status page
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-data:/app/data

volumes:
  caddy_data:
  uptime-data:
