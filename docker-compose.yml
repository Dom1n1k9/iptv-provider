version: "3.9"

services:
  # Live TV / transcode / proxy server (RPi 5-friendly)
  iptv:
    image: danielkucera/nginx-rtmp
    container_name: iptv
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (bind to LAN only: 192.168.1.10:1935:1935)
      - "8080:80"     # HTTP / HLS / stat page (LAN only)
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=Europe/Paris

  # EPG (Electronic Program Guide) parser -> XMLTV
  epg:
    image: ghcr.io/albertodvp/iptv-epg-grabber
    container_name: epg
    restart: unless-stopped
    volumes:
      - ./config/epg/epg-sources.yml:/app/config.yml:ro
    environment:
      - TZ=Europe/Paris
    command: --flush-cache --output /app/guide.xml
    depends_on:
      - iptv

  # API - generates M3U + XMLTV and serves playlist to clients (TS)
  api:
    build: ./api
    container_name: iptv-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # localhost only; Caddy proxies
    volumes:
      - ./config/channels:/app/config/channels:ro
      - epg-data:/app/data
    environment:
      - TZ=Europe/Paris
      - PLAYLIST_USER=${PLAYLIST_USER:-admin}
      - PLAYLIST_PASS=${PLAYLIST_PASS:-changeme}
    depends_on:
      - epg

  # Reverse proxy / TLS front-end (recommended)
  proxy:
    image: caddy:2-alpine
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - iptv

  # Uptime Kuma - monitoring/status page
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-data:/app/data

volumes:
  epg-data:
  caddy_data:
  uptime-data:
